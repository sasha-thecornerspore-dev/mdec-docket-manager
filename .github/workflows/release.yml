# Builds and publishes a release when a v* tag is pushed.
#
# WINDOWS ONLY, deliberately. The app is Windows-only in source, not merely
# unsigned there: the Playwright browser-path resolution, the browser-on-disk
# check, the app window, the data directory and the error dialog all assume
# Windows. A macOS tarball would therefore be an unsigned, iconless folder that
# cannot find or install the browser it exists to drive, and it would fail
# quietly while doing so -- worse than shipping nothing. macOS becomes its own
# milestone once frozen_entry, bootstrap and desktop grow real platform
# branches; until then this workflow does not pretend otherwise.
#
# The build runs inside a virtual environment because tools/build_installer.py
# refuses to freeze from a shared interpreter -- PyInstaller bundles whatever it
# can import, and a runner's system Python is not a controlled input.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload assets

jobs:
  verify-tag:
    # A tag that disagrees with __version__ produces a release whose assets are
    # named one thing and report another. Catch it before anything is built.
    name: verify the tag matches __version__
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than relying on whatever `python` the runner image happens
      # to provide. This job is the gate, and a gate that breaks when the image
      # changes underneath it is not a gate.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*[\"\047]([^\"\047]+)', pathlib.Path('mdec/__init__.py').read_text()).group(1))")
          echo "tag=$tag  __version__=$src"
          if [ "$tag" != "$src" ]; then
            echo "::error::tag v$tag does not match mdec/__init__.py __version__=$src"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  test:
    # test.yml runs on every push, including a tag push, but nothing blocked on
    # its result -- so a tag could publish over a red suite. This job is the one
    # `publish` waits for.
    name: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - run: python -m pytest -q

  standalone:
    name: windows-x64
    needs: verify-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Create the build environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --upgrade pip
          .venv/Scripts/python -m pip install -r requirements.txt
          .venv/Scripts/python -m pip install pyinstaller

      - name: Build the app, the installer and the portable zip
        run: .venv\Scripts\python tools/build_installer.py

      - name: Collect the artefacts, by name
        shell: bash
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          mkdir -p staging
          setup="dist/MDEC-Docket-Manager-${VERSION}-Setup.exe"
          portable="dist/MDEC-Docket-Manager-${VERSION}-portable.zip"
          # build_installer.py PRINTS a warning and returns None when Inno Setup
          # is missing rather than raising, so a runner where choco half-worked
          # would otherwise produce a release with no installer in it.
          test -f "$setup"    || { echo "::error::no installer at $setup"; exit 1; }
          test -f "$portable" || { echo "::error::no portable zip at $portable"; exit 1; }
          cp "$setup" "$portable" staging/
          ls -la staging

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: staging/*
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [verify-tag, test, standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOT "assets": that is a tracked directory in this repo (mdec.ico,
      # mdec-256.png, installer_after.txt), so downloading into it and globbing
      # it published three repo files as release assets.
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Hash the artefacts
        shell: bash
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          cd release-assets
          if [ -z "$(ls -A)" ]; then
            echo "::error::no artefacts were downloaded; refusing to publish an empty release"
            exit 1
          fi
          test -f "MDEC-Docket-Manager-${VERSION}-Setup.exe" \
            || { echo "::error::installer missing from the artefact set"; exit 1; }
          test -f "MDEC-Docket-Manager-${VERSION}-portable.zip" \
            || { echo "::error::portable zip missing from the artefact set"; exit 1; }
          # One file over the assembled set. The format is fixed -- 64 hex, two
          # spaces, the bare file name -- because that is what a verifier parses.
          sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write the release notes
        shell: bash
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          printf '%s\n' \
            '## Install' \
            '' \
            "Download **MDEC-Docket-Manager-${VERSION}-Setup.exe** and run it. It installs" \
            'per-user, so there is no administrator prompt.' \
            '' \
            'SmartScreen will warn about an unrecognised publisher: the installer is **not' \
            'code-signed**. That means the operating system cannot vouch for it, so the' \
            'SHA-256 below is what to check rather than Windows'"'"' opinion of it.' \
            '' \
            '## Verify your download' \
            '' \
            '```powershell' \
            "Get-FileHash .\\MDEC-Docket-Manager-${VERSION}-Setup.exe -Algorithm SHA256" \
            '```' \
            '' \
            'Compare the result against `SHA256SUMS.txt`, attached below. On Linux or' \
            'macOS, `sha256sum -c SHA256SUMS.txt` checks every file at once.' \
            '' \
            '```' > notes.md
          cat release-assets/SHA256SUMS.txt >> notes.md
          printf '%s\n' \
            '```' \
            '' \
            '## Windows only' \
            '' \
            'This release is Windows-only. The app is Windows-specific in source, not' \
            'merely unsigned elsewhere, so no macOS or Linux build is published rather' \
            'than one that would fail quietly.' >> notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          # Create on the first run for this tag; upload on a re-run, so a retry
          # after one job failed does not need the release deleting first.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" release-assets/* --clobber
          else
            gh release create "v${VERSION}" release-assets/* \
              --title "MDEC Docket Manager ${VERSION}" \
              --notes-file notes.md
          fi
